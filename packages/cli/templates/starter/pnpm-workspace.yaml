packages:
  - workers/*
  - app
# Wrangler needs the esbuild and workerd install scripts (pnpm blocks unapproved build scripts).
allowBuilds:
  esbuild: true
  workerd: true
  # Not needed: Firebase web-app auto-init from FIREBASE_WEBAPP_CONFIG, and a
  # protobufjs dependents version check.
  "@firebase/util": false
  protobufjs: false
